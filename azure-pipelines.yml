name: $(majorVersion).$(minorVersion)$(rev:.r)

trigger:
  # One run at a time per branch. Overlapping runs can publish out of order,
  # and the Marketplace rejects a version lower than the one already published.
  batch: true
  branches:
    include:
      - main
      - feature/*
      - bug/*
  # Files that are not part of the extension package do not trigger a build.
  paths:
    exclude:
      - SECURITY.md
      - CONTRIBUTING.md
      - CLAUDE.md
      - docs
      - scripts
      - .claude
      - .github
      - .vscode
      - .mcp.json

# Pull requests are validated by GitHub Actions. Feature and bug branches publish
# the private test build, and the private dev build only when the run sets
# publishDev. Main publishes the private test build and the public prod build,
# and never the dev build, which points at localhost.
pr: none

parameters:
- name: publishDev
  displayName: Publish the dev build (feature and bug branches only)
  type: boolean
  default: false

variables:
  - template: .azure-pipelines/variables.yml

stages:
- stage: Build
  jobs:
  - template: .azure-pipelines/build.yml
    parameters:
      publishDev: ${{ parameters.publishDev }}

- ${{ if eq(parameters.publishDev, true) }}:
  - stage: DeployDev
    dependsOn: Build
    # Not from main: the dev build loads its assets from localhost.
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'), ne(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
    - template: .azure-pipelines/deploy.yml
      parameters:
        environment: dev

- stage: DeployTest
  dependsOn: Build
  # Release build (assets packaged, no localhost), private and shared with
  # the org. Gate it with an approval on the test environment.
  condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
  jobs:
  - template: .azure-pipelines/deploy.yml
    parameters:
      environment: test

- stage: DeployProd
  dependsOn: DeployTest
  # Public prod build, from main only. Gate it with an approval on the prod
  # environment.
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - template: .azure-pipelines/deploy.yml
    parameters:
      environment: prod
