variables:
  extensionId: 'deployment-status-to-boards'
  extensionName: 'Deployment Status to Boards for YAML'
  publisherId: 'excelery'
  sourceDir: $(Build.SourcesDirectory)
  serviceConnection: spn-azdo-marketplace-publish
  shareWith: 'excelery'
  # Test and prod can be shared with more organizations through the pipeline
  # variables testShareWithOrgs and prodShareWithOrgs (comma-separated), set in
  # Azure DevOps rather than here.
  testShareWith: $[ coalesce(variables['testShareWithOrgs'], 'excelery') ]
  prodShareWith: $[ coalesce(variables['prodShareWithOrgs'], 'excelery') ]
  majorVersion: 0
  minorVersion: 2
