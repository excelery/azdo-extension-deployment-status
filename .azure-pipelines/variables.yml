variables:
  extensionId: 'deployment-status-to-boards'
  extensionName: 'Deployment Status to Boards for YAML'
  publisherId: 'excelery'
  sourceDir: $(Build.SourcesDirectory)
  serviceConnection: spn-azdo-marketplace-publish
  # GitHub service connection used to create a release after each prod publish.
  githubConnection: excelery
  githubRepository: excelery/azdo-extension-deployment-status
  shareWith: 'excelery'
  # Test can be shared with more organizations through the pipeline variable
  # testShareWithOrgs (comma-separated), set in Azure DevOps rather than here.
  testShareWith: $[ coalesce(variables['testShareWithOrgs'], 'excelery') ]
  majorVersion: 0
  minorVersion: 2
