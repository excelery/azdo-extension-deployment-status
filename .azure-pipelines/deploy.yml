parameters:
- name: environment
  type: string

jobs:
- deployment: Publish
  environment: deployment-status-${{ parameters.environment }}
  # The self-hosted agent: the Microsoft-hosted free tier ran out of minutes.
  pool: Default
  strategy:
    runOnce:
      deploy:
        steps:
        - download: current
          artifact: drop

        # tfx needs Node, which a self-hosted agent may not have.
        - task: UseNode@1
          inputs:
            version: '22.x'

        # Dev and test are installed side by side. Add the environment to the names
        # users choose from (custom control, menu item), so the installs can be told apart.
        # PowerShell, so it runs on Windows and Linux agents alike.
        - ${{ if ne(parameters.environment, 'prod') }}:
          - task: PowerShell@2
            displayName: Tag names with the environment
            inputs:
              targetType: inline
              script: |
                $ErrorActionPreference = 'Stop'
                Add-Type -AssemblyName System.IO.Compression, System.IO.Compression.FileSystem
                $suffix = " (${{ parameters.environment }})"
                $zip = [System.IO.Compression.ZipFile]::Open($env:VSIX, 'Update')
                try {
                  $entry = $zip.GetEntry('extension.vsomanifest')
                  $reader = New-Object System.IO.StreamReader($entry.Open())
                  $manifest = $reader.ReadToEnd() | ConvertFrom-Json
                  $reader.Close()
                  foreach ($c in $manifest.contributions) {
                    if ($c.type -eq 'ms.vss-work-web.work-item-form-control' -and $c.properties.name) {
                      $c.properties.name += $suffix
                    }
                    if ($c.type -eq 'ms.vss-web.action' -and $c.properties.text) {
                      $c.properties.text += $suffix
                    }
                  }
                  $json = ConvertTo-Json -InputObject $manifest -Depth 100 -Compress
                  $entry.Delete()
                  $writer = New-Object System.IO.StreamWriter($zip.CreateEntry('extension.vsomanifest').Open())
                  $writer.Write($json)
                  $writer.Close()
                } finally {
                  $zip.Dispose()
                }
            env:
              ${{ if eq(parameters.environment, 'dev') }}:
                VSIX: $(Pipeline.Workspace)/drop/$(extensionId)-dev-$(Build.BuildNumber).vsix
              ${{ if ne(parameters.environment, 'dev') }}:
                VSIX: $(Pipeline.Workspace)/drop/$(extensionId)-$(Build.BuildNumber).vsix

        - task: TfxInstaller@5
          displayName: Use Node CLI for Azure DevOps

        - task: PublishAzureDevOpsExtension@5
          # The reference name is what makes $(publish.Extension.OutputPath)
          # resolve for the validation step below.
          name: publish
          displayName: Publish extension
          inputs:
            connectTo: 'VsTeam'
            connectedServiceName: '$(serviceConnection)'
            fileType: vsix
            # dev publishes the dev-override vsix (baseUri -> localhost); every
            # other environment publishes the release vsix.
            ${{ if eq(parameters.environment, 'dev') }}:
              vsixFile: '$(Pipeline.Workspace)/drop/$(extensionId)-dev-$(Build.BuildNumber).vsix'
            ${{ if ne(parameters.environment, 'dev') }}:
              vsixFile: '$(Pipeline.Workspace)/drop/$(extensionId)-$(Build.BuildNumber).vsix'
            publisherId: '$(publisherId)'
            # Keep the base id here: extensionTag is appended to it, so setting
            # both would publish as <id>-<env>-<env>.
            extensionId: '$(extensionId)'
            ${{ if ne(parameters.environment, 'prod') }}:
              extensionTag: '-${{ parameters.environment }}'
              extensionName: '$(extensionName) (${{ parameters.environment }})'
            ${{ if eq(parameters.environment, 'prod') }}:
              extensionName: '$(extensionName)'
            extensionVersion: '$(Build.BuildNumber)'
            # All builds are private and shared with selected organizations.
            # Prod keeps the Preview flag; switch it to publicpreview to list
            # it publicly.
            ${{ if eq(parameters.environment, 'dev') }}:
              shareWith: '$(shareWith)'
              extensionVisibility: private
            ${{ if eq(parameters.environment, 'test') }}:
              shareWith: '$(testShareWith)'
              extensionVisibility: private
            ${{ if eq(parameters.environment, 'prod') }}:
              shareWith: '$(prodShareWith)'
              extensionVisibility: privatepreview
            noWaitValidation: true

        - task: IsAzureDevOpsExtensionValid@5
          displayName: Wait for Marketplace validation
          inputs:
            connectTo: 'VsTeam'
            connectedServiceName: '$(serviceConnection)'
            method: 'id'
            publisherId: '$(publisherId)'
            extensionId: '$(extensionId)'
            ${{ if ne(parameters.environment, 'prod') }}:
              extensionTag: '-${{ parameters.environment }}'
            extensionVersion: '$(Build.BuildNumber)'

        # One GitHub release per prod publish, tagged on the commit that was built.
        # The notes list the commits (squashed pull request titles) since the last release.
        - ${{ if eq(parameters.environment, 'prod') }}:
          - task: GitHubRelease@1
            displayName: Create GitHub release
            inputs:
              gitHubConnection: '$(githubConnection)'
              repositoryName: '$(githubRepository)'
              action: create
              target: '$(Build.SourceVersion)'
              tagSource: userSpecifiedTag
              tag: 'v$(Build.BuildNumber)'
              title: 'v$(Build.BuildNumber)'
              releaseNotesSource: inline
              releaseNotesInline: 'Published to the Visual Studio Marketplace as version $(Build.BuildNumber).'
              # Users install from the Marketplace; no package is attached.
              assets: ''
              isPreRelease: true
              addChangeLog: true
              changeLogCompareToRelease: lastNonDraftRelease
              changeLogType: commitBased
