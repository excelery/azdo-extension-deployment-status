name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so advisories published after a merge still surface.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    # Uploading results needs Advanced Security, which private repositories do
    # not have, so the run would otherwise always end red. This turns itself on
    # when the repository becomes public.
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
