name: Claude review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  # The action exchanges an OIDC token for a Claude GitHub App token, so
  # the review is posted by claude[bot].
  id-token: write

jobs:
  review:
    # Forks do not get secrets, so the action cannot run on them. The CI
    # workflow still validates fork pull requests.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The review needs history to reason about what changed and why.
          fetch-depth: 0

      - uses: anthropics/claude-code-action@cab360f6565aa35a51d6ce9e43f1f4287c0a32ea # v1
        id: review
        with:
          # Dependabot pull requests are reviewed too; a passing review lets
          # them merge automatically. Dependabot needs the secret under
          # Settings > Secrets > Dependabot as well.
          allowed_bots: "dependabot[bot]"
          # Either secret works: an API key bills the Anthropic Console, an
          # OAuth token from `claude setup-token` bills a Claude plan.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review this pull request.

            Read .claude/skills/pr-review/SKILL.md first and follow it. It is the
            review standard for this repository, and it is deliberately specific:
            this extension must never write to Azure DevOps, its scopes must stay
            read-only, logic belongs in src/Deployments.ts so it stays testable,
            and there is a list of traps that have each shipped a bug once.

            Also read CLAUDE.md for the constraints that are not obvious from the
            code.

            Report findings most severe first. For each one, say what breaks and
            under what input or condition -- a reviewer should be able to judge it
            without re-deriving your reasoning. If a change cannot be judged from
            the diff alone, such as a manifest change or anything affecting
            rendering, say what evidence you would want rather than guessing.

            Post each finding as an inline comment on the line it concerns, and
            a short summary with `gh pr comment`.

            Say so plainly if you find nothing worth raising. Inventing findings
            to look thorough wastes more time than it saves.

            Finally, set `blocking` to true if any finding should stop this pull
            request from merging, and false otherwise. A failed review blocks
            automatic merging of Dependabot updates.
          claude_args: |
            --max-turns 20
            --model claude-sonnet-5-5
            --json-schema '{"type":"object","properties":{"blocking":{"type":"boolean"}},"required":["blocking"]}'
            --allowedTools "Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"

      - name: Fail on blocking findings
        env:
          RESULT: ${{ steps.review.outputs.structured_output }}
        run: |
          echo "$RESULT"
          test "$(echo "$RESULT" | jq -r .blocking)" = "false"
